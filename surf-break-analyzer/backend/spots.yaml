    size_range_ft: [3, 7]
    tide: {best: mid, notes: "TBD — Ryan: does it show better on lower or higher tide?"}
    wind: {tolerates: "Light to moderate NW."}
    bottom: reef
    local_notes: >
      Ryan's observation: this peak only shows on a true S/SW swell. On NW or
      mid-period swell, sets all break on the main Slot peak and the second peak
      never forms. Tide may also matter (higher tide may keep energy together on
      one peak) — unverified.
    confidence: low

  - id: cowells
