# Spot knowledge base — Santa Cruz County (+ Moss Landing).
#
# This file is where most of the app's accuracy comes from. v1 entries are from
# general knowledge; Ryan's local corrections should replace them. Use the
# `confidence` field (low / medium / high) to tell the model how much to trust
# each entry, and bump it when you've verified it in the water.
#
# Field guide
#   faces_deg        compass direction the break opens toward (open ocean side).
#                    Offshore wind blows FROM faces_deg + 180.
#   swell_window     FROM-directions of swell, degrees true.
#     best_dir_deg   [lo, hi] clockwise arc where the spot lights up.
#     ok_dir_deg     [lo, hi] arc where it still works, usually smaller/inconsistent.
#     wrap_min_period_s  swell from the ok-but-not-best part of the window needs at
#                        least this period to bend in. Short period just doesn't make it.
#   size_range_ft    [min, max] face heights where it's surfable / holds.
#   tide             best: low | low-mid | mid | mid-high | high | any
#   wind.tolerates   free text about which winds it handles.
#   forecast_point   north_coast | santa_cruz | south_county (see config.py)
#   default          true = shown in the default (Lane) view.
#   lat/lon          approximate.

spots:
  # ---------------------------------------------------------------- Steamer Lane
  - id: lane-indicators
    name: Indicators
    region: westside
    parent: Steamer Lane
    default: true
    lat: 36.9506
    lon: -122.0287
    forecast_point: santa_cruz
    faces_deg: 200
    swell_window: {best_dir_deg: [240, 300], ok_dir_deg: [190, 320], wrap_min_period_s: 10}
    size_range_ft: [6, 15]
    tide: {best: mid, notes: "Can get bumpy on big low tides."}
    wind: {tolerates: "Light to moderate NW is side-offshore."}
    bottom: reef
    local_notes: >
      Westernmost section of the Lane, outside and up toward Lighthouse Field.
      Needs a decent-sized W/NW swell to break; long walling right that can run
      toward the Point on bigger days. Asleep on small or S-only swells.
    confidence: medium

  - id: lane-middle-peak
    name: Middle Peak
    region: westside
    parent: Steamer Lane
    default: true
    lat: 36.9500
    lon: -122.0270
    forecast_point: santa_cruz
    faces_deg: 200
    swell_window: {best_dir_deg: [245, 300], ok_dir_deg: [195, 320], wrap_min_period_s: 10}
    size_range_ft: [8, 20]
    tide: {best: any, notes: "Less tide-sensitive because it's deep and outside."}
    wind: {tolerates: "Light to moderate NW."}
    bottom: reef (deep, outside)
    local_notes: >
      Outside peak in front of the lighthouse. Only starts breaking with real size
      (roughly 8 ft+ faces). Peaky; lefts and rights.
    confidence: medium

  - id: lane-point
    name: The Point
    region: westside
    parent: Steamer Lane
    default: true
    lat: 36.9508
    lon: -122.0258
    forecast_point: santa_cruz
    faces_deg: 200
    swell_window: {best_dir_deg: [215, 300], ok_dir_deg: [165, 320], wrap_min_period_s: 10}
    size_range_ft: [3, 15]
    tide: {best: mid, notes: "Workable most tides; very low tide gets ledgy near the rocks."}
    wind: {tolerates: "Light to moderate NW is side-offshore; sheltered compared with the North Coast."}
    bottom: reef
    local_notes: >
      The most exposed part of the Lane to W/NW energy wrapping around the
      lighthouse, so it works on the widest range of swells. On mid-period NW
      (e.g. 11 s from 315°) it's often the only section really breaking because
      that energy doesn't bend far enough to reach the bight.
    confidence: medium

  - id: lane-slot
    name: The Slot (main peak)
