    tide: {best: mid, notes: "TBD — Ryan."}
    wind: {tolerates: "Light to moderate NW; tucked against the cliff."}
    bottom: reef
    local_notes: >
      Inside of the Point, along the cliff. On NW swell the sets that do reach the
      Slot all break on this main peak.
    confidence: low

  - id: lane-slot-second-peak
    name: The Slot (second peak)
    region: westside
